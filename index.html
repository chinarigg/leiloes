<title>Lilie's Club · Leilões</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
color-scheme:dark;--bg:#0b0b0b;--card:#161616;--tx:#f5f1e6;--mut:#a39c88;--bd:#2e2b20;--ac:#f6d26b;--ac2:#2a2410;--on:#1a1500}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Montserrat,system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0;display:flex;align-items:center;gap:10px;font-weight:800;color:var(--ac)}h1 img{width:44px;height:44px;border-radius:50%}
#login{max-width:340px;margin:12vh auto;text-align:center}#login img{width:120px;border-radius:50%}#login input{width:100%;margin:6px 0}
.err{color:#f87171;font-size:12px;min-height:16px}
#st{font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--bd);padding:3px 10px;border-radius:99px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-size:18px;margin-top:2px}.tile span{font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:99px;cursor:pointer;font:inherit}
.tab.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input[type=text],input[type=search],select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;min-width:0}
.btn{background:var(--ac);color:var(--on);font-weight:600;border:0;border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.g{background:var(--ac2);color:var(--tx)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11px;letter-spacing:.04em;text-align:left;color:var(--mut);padding:8px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--card)}
td{padding:5px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
td input[type=text],td textarea{width:100%}
textarea{resize:vertical;min-height:34px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
tr.done{opacity:.55}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}
.mut{color:var(--mut);font-size:12px}.tot{font-weight:600;white-space:nowrap}
.warn{background:var(--ac2);padding:10px 12px;border-radius:10px;margin-bottom:10px}
[hidden]{display:none!important}
</style>
</head>

  const last=S.cards[S.cards.length-1];
  const nc={id:crypto.randomUUID(),carta:"",preco:null,quem:"",leilao:last?last.leilao:null};S.cards.push(nc);
  saveCard(nc);$("#q").value="";$("#fl").value="";renderStock();const i=[...document.querySelectorAll('#eb input[data-f="carta"]')].pop();i&&i.focus();
};
$("#imp").onclick=async()=>{
  $("#imp").disabled=true;st("importando…");
  for(let i=0;i<SEED.length;i+=200){const r=await sb.from("cards").insert(SEED.slice(i,i+200).map(c=>({...c,user_id:uid})));if(r.error){st("erro na importação");console.error(r.error);$("#imp").disabled=false;return}}
  await load();$("#imp").disabled=false};
function verticalTab(e){
  if(e.key!=="Tab")return;
  const cell=e.target.closest("td");if(!cell)return;
  const row=cell.parentElement,tbody=row.parentElement;
  const ci=[...row.children].indexOf(cell),ri=[...tbody.children].indexOf(row);
  const nextRow=tbody.children[e.shiftKey?ri-1:ri+1];if(!nextRow)return;
  const target=nextRow.children[ci]?.querySelector("input,textarea");if(!target)return;
  e.preventDefault();target.focus();target.select?.();
}
$("#eb").addEventListener("keydown",verticalTab);
$("#rb").addEventListener("keydown",verticalTab);
["#q","#fl"].forEach(s=>$(s).addEventListener("input",renderStock));
["#rf","#rq"].forEach(s=>$(s).addEventListener("input",renderReport));
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  ["estoque","relatorio"].forEach(id=>$("#"+id).hidden=id!==b.dataset.t);
});

function show(session){
  uid=session?session.user.id:null;
  $("#login").hidden=!!session;$("#app").hidden=!session;
  if(session)load();
}
$("#go").onclick=async()=>{
  $("#err").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  if(error)$("#err").textContent="E-mail ou senha incorretos.";
};
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click()});
$("#out").onclick=()=>sb.auth.signOut();
let firstAuth=false;
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT"){firstAuth=true;setTimeout(()=>show(session),0)}});
  setTimeout(()=>{if(!firstAuth){st("⚠️ sem resposta do Supabase");$("#login").hidden=false;$("#err").textContent="Não consegui verificar o login. Confira a URL/Key e sua conexão."}},6000);
</script>
